name: Build Qwant Messenger for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc/**'
      - '.github/workflows/build-messenger-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Qwant-Messenger-Windows-Installer
          path: pc/dist/Qwant-Messenger-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
